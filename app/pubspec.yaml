name: cscrm
description: "CSCRM — Cleaning Service CRM: buyurtma, xodim va moliya boshqaruv tizimi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  # Kalendar va sana tanlagichlarni o'zbek tilida ko'rsatish uchun.
  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_database: ^11.1.6
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.3
  audioplayers: ^6.1.0
  google_fonts: ^6.2.1
  crypto: ^3.0.5
  intl: ^0.19.0
  table_calendar: ^3.1.3
  geolocator: 12.0.0
  url_launcher: ^6.3.2
  http: ^1.2.2
  package_info_plus: ^8.1.1
  device_info_plus: ^11.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    # Faqat ish vaqtida yuklanadigan fayllar. `assets/icon/` ATAYLAB yo'q -
    # u faqat flutter_launcher_icons uchun manba, ilova ichida ishlatilmaydi,
    # shuning uchun APK'ga qo'shilmaydi.
    - assets/sounds/

  fonts:
    # LOGOTIP SHRIFTI - ilovaga qo'shib yuboriladi.
    #
    # Ilovaning qolgan matni `google_fonts` orqali Manrope bilan
    # chiziladi, u esa birinchi ishga tushishda INTERNETDAN yuklanadi.
    # Logotip uchun bu yaramaydi:
    #   * aloqa yo'q bo'lsa logotip boshqa shriftda chiqadi;
    #   * ilova ikonkasi build paytida chiziladi - u yerda Manrope
    #     umuman yo'q, ya'ni ikonka va ilovadagi logotip bir-biriga
    #     o'xshamay qolardi.
    # Brend belgisi hech qachon yuklab olinadigan narsaga bog'liq
    # bo'lmasligi kerak.
    #
    # Roboto Black (Apache-2.0) Flutter SDK'sidan olingan.
    - family: CscrmLogo
      fonts:
        - asset: assets/fonts/cscrm-logo.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#0B2E77"
  adaptive_icon_foreground: "assets/icon/logo_foreground.png"
