name: cscrm
description: "CSCRM — Cleaning Service CRM: buyurtma, xodim va moliya boshqaruv tizimi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  # Kalendar va sana tanlagichlarni o'zbek tilida ko'rsatish uchun.
  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_database: ^11.1.6
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.3
  audioplayers: ^6.1.0
  crypto: ^3.0.5
  intl: ^0.19.0
  table_calendar: ^3.1.3
  geolocator: 12.0.0
  url_launcher: ^6.3.2
  http: ^1.2.2
  package_info_plus: ^8.1.1
  device_info_plus: ^11.1.1
  # Barmoq izi / yuz bilan ochish — ilova qulfi uchun.
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    # Faqat ish vaqtida yuklanadigan fayllar. `assets/icon/` ATAYLAB yo'q -
    # u faqat flutter_launcher_icons uchun manba, ilova ichida ishlatilmaydi,
    # shuning uchun APK'ga qo'shilmaydi.
    - assets/sounds/

  fonts:
    # BARCHA SHRIFTLAR ILOVA ICHIDA — internetdan hech narsa yuklanmaydi.
    #
    # Ilgari asosiy matn `google_fonts` orqali Manrope bilan chizilardi va
    # shrift birinchi ishga tushishda internetdan yuklanardi. Ikki muammo
    # bor edi:
    #   * aloqa yo'q bo'lsa ilova boshqa shriftda ochilardi;
    #   * Manrope'da o'zbek kirill harflari (Қ Ғ Ҳ) va to'g'ri tutuq
    #     belgisi yo'q — kirill yozuvida bu harflar boshqa shriftdan
    #     olinib, so'z ichida "g'alati" ko'rinardi.
    #
    # Ikkala oila ham lotin va kirill o'zbek alifbosini TO'LIQ qamraydi
    # (Ў Қ Ғ Ҳ, ‘ ’, № va h.k.) — buni test/fonts_test.dart tekshiradi.
    #
    # Matn — Roboto (Apache-2.0, Flutter SDK'sidan): Android'ning o'z
    # shrifti, mayda o'lchamda ham o'qilishi eng yaxshi.
    - family: CscrmSans
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700

    # Sarlavha va katta raqamlar — Montserrat (SIL OFL 1.1).
    - family: CscrmDisplay
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
          weight: 700

    # LOGOTIP SHRIFTI. Ilova ikonkasi build paytida shu shrift bilan
    # chiziladi — ikonka va ilovadagi logotip bir xil ko'rinishi uchun.
    # Roboto Black (Apache-2.0) Flutter SDK'sidan olingan.
    - family: CscrmLogo
      fonts:
        - asset: assets/fonts/cscrm-logo.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#0B2E77"
  adaptive_icon_foreground: "assets/icon/logo_foreground.png"
