# Render Blueprint — CSCRM.
#
# Joylash: Render → New → Blueprint → shu repozitoriyni tanlang.
# Maxfiy qiymatlar (`sync: false`) Render panelida QO'LDA kiritiladi —
# ular hech qachon repoga tushmaydi.

services:
  # --- API (backend) ---
  - type: web
    name: cscrm-api
    runtime: node
    plan: free
    # Baza `asia-southeast1` (Singapur) da. API har bir so'rovda bazaga
    # bir necha marta boradi, shuning uchun u BAZA BILAN BIR JOYDA
    # turishi kerak. Frankfurt'da bo'lsa har bir baza chaqiruvi
    # Yevropa-Osiyo oralig'ini bosib o'tardi.
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        # Websayt manzili. O'z domeningizni ulagach shu yerni yangilang.
        value: https://cscrm-web.onrender.com
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false          # service account JSON, base64 ko'rinishida
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: LICENSE_SIGNING_SECRET
        # DIQQAT: bu yerda `generateValue: true` BO'LMASLIGI kerak.
        # Ilova imzoni O'ZIDAGI nusxa bilan tekshiradi (`app/env/*.json`).
        # Render boshqa kalit yaratsa, har bir foydalanuvchi "obuna
        # javobining imzosi to'g'ri kelmadi" xatosini olardi.
        # Ilovadagi qiymat bilan AYNAN bir xilini qo'lda kiriting.
        sync: false
      - key: SUPER_ADMIN_UIDS
        sync: false

      # To'lov rekvizitlari — ilovadagi to'lov ekranida ko'rinadi.
      # Kodda emas, shu yerda: karta almashsa ilovani qayta yig'ish
      # shart emas, Render'da qiymatni o'zgartirish kifoya.
      - key: PAYMENT_CARDS
        sync: false          # vergul bilan; turi raqamdan aniqlanadi
      - key: PAYMENT_CARD_HOLDER
        sync: false
      - key: PAYMENT_PHONE
        sync: false
      - key: PAYMENT_EMAIL
        sync: false
      - key: PAYMENT_TELEGRAM
        sync: false

  # --- Websayt (marketing + super-admin panel) ---
  - type: web
    name: cscrm-web
    runtime: static
    plan: free
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    # SPA: har qanday yo'l index.html ga yo'naltiriladi, aks holda
    # /narxlar sahifasini to'g'ridan-to'g'ri ochganda 404 chiqadi.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cscrm-api.onrender.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_DATABASE_URL
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
