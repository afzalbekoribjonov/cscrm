# Render Blueprint — CSCRM.
#
# BITTA servis: websayt ham, API ham shu yerdan tarqatiladi.
#
# Nega bitta: Render'da har bir web-servis alohida hisoblanadi. Bitta
# bo'lsa — bitta manzil, bitta uyg'oq tutish pingi va CORS umuman kerak
# emas (sayt va API bir xil origin'da).
#
# Joylash: Render → New → Blueprint → shu repozitoriyni tanlang.
# Yoki qo'lda: New → Web Service, quyidagi buyruqlarni ko'chiring.
#
# Maxfiy qiymatlar (`sync: false`) Render panelida QO'LDA kiritiladi —
# ular hech qachon repoga tushmaydi.

services:
  - type: web
    name: cscrm
    runtime: node
    plan: free

    # Baza `asia-southeast1` (Singapur) da. API har bir so'rovda bazaga
    # bir necha marta boradi, shuning uchun u BAZA BILAN BIR JOYDA
    # turishi kerak.
    region: singapore

    # Ildizdagi `package.json` ikkalasini ham yig'adi va ishga tushiradi.
    buildCommand: npm run build
    startCommand: npm run start

    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit

    envVars:
      - key: NODE_ENV
        value: production

      # Sayt va API bir xil origin'da — tashqi origin'ga ruxsat kerak
      # emas. Servis o'z origin'iga va mobil ilovaga (Origin sarlavhasi
      # yo'q) baribir ruxsat beradi.
      - key: CORS_ORIGINS
        value: ''

      # --- Firebase ---
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false          # service account JSON, base64 ko'rinishida
      - key: FIREBASE_DATABASE_URL
        sync: false

      # --- Litsenziya imzosi ---
      - key: LICENSE_SIGNING_SECRET
        # DIQQAT: bu yerda `generateValue: true` BO'LMASLIGI kerak.
        # Ilova imzoni O'ZIDAGI nusxa bilan tekshiradi (`app/env/*.json`).
        # Render boshqa kalit yaratsa, har bir foydalanuvchi "obuna
        # javobining imzosi to'g'ri kelmadi" xatosini olardi.
        sync: false

      # --- Super-admin ---
      - key: SUPER_ADMIN_UIDS
        sync: false

      # --- To'lov rekvizitlari ---
      # Ilovadagi to'lov ekranida ko'rinadi. Kodda emas, shu yerda:
      # karta almashsa ilovani qayta yig'ish shart emas.
      - key: PAYMENT_CARDS
        sync: false          # vergul bilan; turi raqamdan aniqlanadi
      - key: PAYMENT_CARD_HOLDER
        sync: false
      - key: PAYMENT_PHONE
        sync: false
      - key: PAYMENT_EMAIL
        sync: false
      - key: PAYMENT_TELEGRAM
        sync: false
