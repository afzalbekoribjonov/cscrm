    <meta property="og:site_name" content="CSCRM" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:title" content="CSCRM — xizmat biznesi uchun boshqaruv tizimi" />

      property="og:description"
      content="Buyurtma qabul qilishdan pul yig'ishgacha. Daftar o'rniga — aniq, tartibli va har doim qo'lingizda."
    />
    <!-- og:image ATAYLAB YO'Q.
         Mavjud rasm (favicon) 64x64 — Telegram va Facebook bunday
         kichik rasmni umuman ko'rsatmaydi. Mavjud bo'lmagan faylga
         ishora qilish esa undan ham yomon: tizim rasmni yuklab
         olmoqchi bo'lib kutadi va havola kechroq ochiladi.
         1200x630 li rasm tayyorlanganda `/og.png` deb qo'shiladi. -->
    <meta name="twitter:card" content="summary" />

    <!--
      REJIM SKRIPTI — React'dan OLDIN, bloklovchi holda yuklanadi.
